# Runs MIMS in two containers: "db" (MySQL with the MIMS database) and "app" (the Node.js API, which also serves the
# React pages). Nothing else needs installing except Docker.
#   Start:            docker compose up --build        then open http://localhost:8080
#   Stop:             Ctrl + C   (or: docker compose down)
#   SQL tests:        docker compose exec db mims-tests
#   Fresh sample data: docker compose down -v   (deletes the database volume), then start again
#   Test e-mails:     docker compose --profile mail up --build   then open http://localhost:8025 (see README)
# The passwords below are local-only defaults. To choose your own, copy .env.example to .env before the first start.
name: mims

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mims-root-local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-mims-app-local}
    volumes:
      - db-data:/var/lib/mysql   # the database survives restarts; "docker compose down -v" deletes it
    ports:
      - "127.0.0.1:3307:3306"    # for MySQL Workbench on this computer; 3307 so it never clashes with a local MySQL
    healthcheck:
      # Healthy once mims_app can read the loaded data over the network, i.e. after db-init.sh has finished
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$APP_DB_PASSWORD\" mysql -h 127.0.0.1 -u mims_app -e 'SELECT 1 FROM mims.CUSTOMER LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  app:
    build: .
    # The app stops if MySQL is not answering yet (after "docker compose restart" or a reboot both start together),
    # so Docker starts it again until the database is ready
    restart: unless-stopped
    environment:
      DB_HOST: db                # the database container's name on the Docker network
      DB_PORT: 3306
      DB_USER: mims_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-mims-app-local}
      DB_NAME: mims
      # Signs the sign-in cookies. Empty = a new random secret at every start (everyone signs in again after a restart).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # E-mail notifications (README, "Email notifications"). Empty SMTP_HOST = off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_DEMO_INBOX: ${MAIL_DEMO_INBOX:-}
      MAIL_SEND_TO_CUSTOMERS: ${MAIL_SEND_TO_CUSTOMERS:-}
      MAIL_REVIEW_TO: ${MAIL_REVIEW_TO:-}
    ports:
      - "127.0.0.1:8080:3001"    # the app at http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  # A pretend mail server with an inbox in the browser, for trying the e-mails without a real e-mail account.
  # Only started with "docker compose --profile mail up"; then set SMTP_HOST=mail and SMTP_PORT=1025 in .env.
  mail:
    image: axllent/mailpit:v1.31.0
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"    # the test inbox at http://localhost:8025

volumes:
  db-data:
